# DKMS packaging for the SeekWave SWT6621S (SV6160LITE) wifi driver.
#
# Install as a DKMS source tree, e.g.:
#   cp -r . /usr/src/swt6621s-25.34.7.1
#   dkms add -m swt6621s -v 25.34.7.1
#   dkms build -m swt6621s -v 25.34.7.1
#   dkms install -m swt6621s -v 25.34.7.1
#
# Vendor drop SWT6621S_H25.34.7.1_F25.34.6.1. The DKMS version is the numeric
# part so it is also a valid dpkg version (see debian/changelog).
#
# Both transports are built; only the one whose hardware is present probes.
#   skw_sdio_lite  - SDIO BSP (probe first on SDIO boards)
#   skw_usb_lite   - USB BSP (auto-loads the core via request_module)
#   swt6621s_wifi  - cfg80211 full-MAC core
#   skwbt          - Bluetooth HCI driver (binds the BSP's btseekwave device)
#
# Firmware for both transports lives in firmware/ and must be copied to
# /lib/firmware separately (DKMS only manages the modules).

PACKAGE_NAME="swt6621s"
PACKAGE_VERSION="25.34.7.1"

BUILT_MODULE_NAME[0]="skw_sdio_lite"
BUILT_MODULE_LOCATION[0]="drivers/seekwaveplatform_lite"
DEST_MODULE_LOCATION[0]="/updates"

BUILT_MODULE_NAME[1]="skw_usb_lite"
BUILT_MODULE_LOCATION[1]="drivers/seekwaveplatform_lite"
DEST_MODULE_LOCATION[1]="/updates"

BUILT_MODULE_NAME[2]="swt6621s_wifi"
BUILT_MODULE_LOCATION[2]="drivers/swt6621s_wifi"
DEST_MODULE_LOCATION[2]="/updates"

BUILT_MODULE_NAME[3]="skwbt"
BUILT_MODULE_LOCATION[3]="drivers/swtbt4l"
DEST_MODULE_LOCATION[3]="/updates"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CONFIG_SEEKWAVE_BSP_DRIVERS=m CONFIG_SKW_SDIOHAL=m CONFIG_SKW_USB=m CONFIG_WLAN_VENDOR_SWT6621S=m CONFIG_SKW_BT=m modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILD_EXCLUSIVE_CONFIG="CONFIG_CFG80211"
AUTOINSTALL="yes"
